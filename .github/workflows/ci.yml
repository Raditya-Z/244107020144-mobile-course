name: ci
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10-week-10-ai-feature-integration
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
